<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlimited OCR</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e8ec; --muted: #8b93a3; --accent: #4c8dff;
    --ok: #35c48a; --err: #ff6b6b; --warn: #f0b429;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea;
      --fg: #1a1d23; --muted: #666e7d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  #drop {
    border: 2px dashed var(--line); border-radius: 12px; padding: 44px 20px;
    text-align: center; cursor: pointer; background: var(--panel);
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); }
  #drop.over { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  #drop p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); margin-top: 8px;
  }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.done { color: var(--ok); border-color: var(--ok); }
  .badge.failed { color: var(--err); border-color: var(--err); }
  .badge.processing { color: var(--warn); border-color: var(--warn); }
  a.dl { color: var(--accent); font-size: 13px; text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  .err { color: var(--err); font-size: 12px; margin-top: 4px; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 18px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Unlimited OCR</h1>
  <p class="sub">Upload PDFs or images. Results are returned as Markdown.</p>

  <div id="drop">
    <strong>Drop files here</strong> or click to browse
    <p>PDF, PNG, JPG, WEBP, BMP &middot; multiple files supported</p>
    <input id="picker" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp" hidden>
  </div>

  <div id="pending" class="hide" style="margin-top:16px">
    <div id="pendingList"></div>
    <button id="send" style="margin-top:14px">Start OCR</button>
  </div>

  <div id="progress" class="hide">
    <div class="bar"><i id="barFill"></i></div>
    <div id="list" style="margin-top:14px"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let queued = [];
let timer = null;

function showPending() {
  $('pending').classList.toggle('hide', queued.length === 0);
  $('pendingList').innerHTML = queued.map((f) =>
    `<div class="row"><span class="name">${escape_(f.name)}</span>
     <span class="badge">${(f.size / 1048576).toFixed(1)} MB</span></div>`).join('');
}

function escape_(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function addFiles(list) {
  queued = queued.concat(Array.from(list));
  showPending();
}

$('drop').onclick = () => $('picker').click();
$('picker').onchange = (e) => addFiles(e.target.files);
['dragenter', 'dragover'].forEach((ev) =>
  $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) =>
  $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', (e) => addFiles(e.dataTransfer.files));

$('send').onclick = async () => {
  if (!queued.length) return;
  $('send').disabled = true;

  const form = new FormData();
  for (const f of queued) form.append('files', f, f.name);

  let res;
  try {
    res = await fetch('/api/upload', { method: 'POST', body: form });
  } catch (e) {
    alert(`Upload failed: ${e.message}`);
    $('send').disabled = false;
    return;
  }
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || 'upload failed');
    $('send').disabled = false;
    return;
  }

  queued = [];
  showPending();
  $('progress').classList.remove('hide');
  poll(data.batch_id);
};

async function poll(batchId) {
  clearInterval(timer);
  const tick = async () => {
    const res = await fetch(`/api/batches/${batchId}`);
    if (!res.ok) return;
    const data = await res.json();
    render(batchId, data);
    if (data.done) {
      clearInterval(timer);
      $('send').disabled = false;
    }
  };
  await tick();
  // OCR takes minutes per document; polling faster just adds load.
  timer = setInterval(tick, 3000);
}

function render(batchId, data) {
  const total = data.files.length;
  const finished = data.files.filter((f) => f.status === 'done' || f.status === 'failed').length;
  $('barFill').style.width = total ? `${(finished / total) * 100}%` : '0';

  $('list').innerHTML = data.files.map((f) => {
    const dl = f.has_result
      ? `<a class="dl" href="/api/batches/${batchId}/files/${encodeURIComponent(f.filename)}">Download .md</a>`
      : '';
    const pages = f.pages ? `<span class="badge">${f.pages}p</span>` : '';
    const err = f.error ? `<div class="err">${escape_(f.error)}</div>` : '';
    return `<div><div class="row">
      <span class="name">${escape_(f.filename)}</span>
      ${pages}<span class="badge ${f.status}">${f.status}</span>${dl}
    </div>${err}</div>`;
  }).join('');
}
</script>
</body>
</html>
