# GPU BOX — OCR inference cluster.
# Deploy this on the machine with the 2x RTX 3080 Ti. The web app runs on a
# separate box (see docker-compose.webapp.yml) and reaches the balancer over
# the network, so unlike the single-box setup the balancer must PUBLISH a port.
# That port is now internet-reachable if the box is: firewall it to the webapp
# box, or put it behind a Cloudflare Tunnel / VPN. Optionally set
# OCR_SHARED_TOKEN so serve.py rejects requests without the matching header.
x-ocr-common: &ocr-common
  build:
    context: .
    dockerfile: Dockerfile.serve
  # Restart indefinitely: an OOM should never leave a GPU permanently idle.
  # The serve.py watchdog exits the process when SGLang dies, which is what
  # makes this fire at all - Docker does not restart merely-unhealthy
  # containers. Watch the RESTARTS column; a climbing count means the model
  # is not fitting and no number of retries will fix it.
  restart: unless-stopped
  volumes:
    # Shared HF cache: both instances read the same weights, so the download
    # happens once rather than per GPU.
    - ../files/models:/models
  environment:
    # infer.py hardcodes fa3 + mem-fraction 0.8, which are wrong for a 12GB
    # SM86 card. These are the knobs that path could not reach.
    ATTENTION_BACKEND: flashinfer
    SGLANG_CHUNKED_PREFILL_SIZE: "256"
    MEM_FRACTION_STATIC: "0.75"
    SGLANG_MAX_IMAGE_TOKENS: "1024"
    CONTEXT_LENGTH: "2048"
    CONCURRENCY: "1"
    PDF_DPI: "120"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    SERVE_PORT: "8000"
    HF_TOKEN: ${HF_TOKEN:-}
    # Empty = open. Set to the same value as the webapp box to require a token
    # on /ocr now that the balancer is network-reachable.
    OCR_SHARED_TOKEN: ${OCR_SHARED_TOKEN:-}

services:
  ocr-gpu0:
    <<: *ocr-common
    # device_ids pins this container to physical GPU 0. It is mutually
    # exclusive with `count` - setting count here would hand both cards to
    # both containers and they would fight over the same VRAM.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  ocr-gpu1:
    <<: *ocr-common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  # Load balancer across the two GPUs and the single entrypoint the webapp box
  # talks to. Published on the host so a remote box can reach it. Bind to a
  # private interface if you have one: set OCR_BIND (e.g. 10.0.0.5) so this
  # never listens on a public NIC.
  balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${OCR_BIND:-0.0.0.0}:8080:8080"
    depends_on:
      - ocr-gpu0
      - ocr-gpu1
