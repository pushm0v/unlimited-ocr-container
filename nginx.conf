worker_processes auto;
events { worker_connections 1024; }

http {
    # Page images are base64-inlined and PDFs arrive whole; the default 1m
    # would reject most real uploads.
    client_max_body_size 512m;
    client_body_timeout  600s;

    # OCR is silent while decoding - no bytes flow until the model finishes a
    # page. These must exceed worst-case single-request latency or nginx
    # returns a spurious 504 mid-generation.
    proxy_connect_timeout 75s;
    proxy_send_timeout    1200s;
    proxy_read_timeout    1200s;

    upstream ocr_backends {
        # least_conn, not round-robin: a 40-page PDF and a single JPEG differ by
        # orders of magnitude, so pick the card with the fewest in-flight jobs.
        least_conn;
        server ocr-gpu0:8000 max_fails=3 fail_timeout=30s;
        server ocr-gpu1:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8080;

        # Balancer liveness only - does not imply a backend is ready.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://ocr_backends;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream responses straight through rather than accumulating them.
            proxy_buffering off;
            proxy_request_buffering off;

            # A backend still loading weights returns 503; retry the other card
            # instead of surfacing the error.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
